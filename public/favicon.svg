<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#121815"/>
  <defs>
    <linearGradient id="archerGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6ee7b7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Hood / Cowl -->
  <path d="M26 18 C26 14 36 12 40 18 C43 23 43 27 40 30 C36 34 26 31 26 18 Z" fill="url(#archerGrad)"/>
  <path d="M29 21 C29 17 37 16 38 21 C39 25 36 27 34 27 C31 27 29 24 29 21 Z" fill="#09100d"/>

  <!-- Body / Cloak -->
  <path d="M24 29 L38 26 L46 48 L32 54 L18 42 Z" fill="url(#archerGrad)" opacity="0.9"/>
  <path d="M22 36 L30 35 L34 47 L20 42 Z" fill="#0f291e"/>

  <!-- Bow -->
  <path d="M46 14 C55 24 55 40 46 50" stroke="url(#archerGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M46 14 L46 50" stroke="#a7f3d0" stroke-width="1" stroke-dasharray="2 1" opacity="0.7"/>

  <!-- Arrow -->
  <line x1="14" y1="32" x2="54" y2="32" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Arrow Head -->
  <polygon points="58,32 50,27 52,32 50,37" fill="#6ee7b7"/>
  <!-- Arrow Fletching -->
  <path d="M14 28 L18 32 L14 36 M18 28 L22 32 L18 36" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
</svg>
